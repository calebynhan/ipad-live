name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two runner images, so the app is checked against an older and the newest Xcode.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Check the app bundle
        run: |
          APP="build/iPad Live.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/iPadLive"
          test -f "$APP/Contents/Resources/AppIcon.icns"

      - name: Zip
        if: matrix.os == 'macos-15'
        run: ditto -c -k --keepParent "build/iPad Live.app" "build/iPad-Live.zip"

      - name: Upload
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v5
        with:
          name: iPad-Live
          path: build/iPad-Live.zip
