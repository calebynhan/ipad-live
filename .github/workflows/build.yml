name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only reads the code; it never pushes, comments or publishes releases.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two runner images, so the app is checked against an older and the newest Xcode.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to exact commits so a moved or compromised tag can't change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Check the app bundle
        run: |
          set -euo pipefail
          APP="build/iPad Live.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/iPadLive"
          test -f "$APP/Contents/Resources/AppIcon.icns"

          # Signed with the hardened runtime...
          SIGNATURE="$(codesign -dv "$APP" 2>&1)"
          echo "$SIGNATURE"
          grep -q 'flags=.*runtime' <<<"$SIGNATURE"
          # ...and allowed nothing beyond camera + audio input.
          codesign -d --entitlements - --xml "$APP" > entitlements.plist
          plutil -p entitlements.plist
          # (PlistBuddy, because plutil -extract would treat the dots in these keys as a path.)
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.camera' entitlements.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' entitlements.plist)" = "true"
          test "$(plutil -p entitlements.plist | grep -c '=>')" = "2"

      - name: Zip
        if: matrix.os == 'macos-15'
        run: ditto -c -k --keepParent "build/iPad Live.app" "build/iPad-Live.zip"

      - name: Upload
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: iPad-Live
          path: build/iPad-Live.zip

  ipad-app:
    name: Build iPad app (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd iPadSender && xcodegen generate

      - name: Build for iOS devices
        run: |
          set -euo pipefail
          xcodebuild -project iPadSender/iPadLiveSender.xcodeproj -scheme iPadLiveSender \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build
