# The iPad app, "iPad Live Sender". Generate the Xcode project with:
#   brew install xcodegen
#   make sender            (from the repository root)
#
# If Xcode says a bundle identifier is unavailable, change BUNDLE_ID_PREFIX below to something
# unique (e.g. com.yourname.ipadlive) and run `make sender` again.
name: iPadLiveSender

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_PREFIX: app.ipadlive
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  iPadLiveSender:
    type: application
    platform: iOS
    sources:
      - path: Sender
      - path: Shared
      - path: ../Sources/LiveLink
    info:
      path: Sender/Info.plist
      properties:
        CFBundleDisplayName: iPad Live Sender
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: iPad Live Sender uses your local network to find your Mac and stream your screen to it.
        NSBonjourServices:
          - _ipadlive._tcp
          - _ipadlive-pair._tcp
        LiveLinkKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    entitlements:
      path: Sender/Sender.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sender
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: iPadLiveBroadcast
    scheme: {}

  iPadLiveBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
      - path: ../Sources/LiveLink
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: iPad Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        NSLocalNetworkUsageDescription: iPad Live streams your screen to your Mac over your local network.
        NSBonjourServices:
          - _ipadlive._tcp
          - _ipadlive-pair._tcp
        LiveLinkKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sender.broadcast
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
